name: ci

on:
  pull_request:
    paths:
      - "apps/orders-api/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/python-service.yml"
  push:
    branches: [main]
    paths:
      - "apps/orders-api/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/python-service.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orders-api:
    uses: ./.github/workflows/python-service.yml
    permissions:
      contents: read
      packages: write
    with:
      context: apps/orders-api
      image_name: orders-api
      gitops_app: orders-api
    secrets:
      GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
