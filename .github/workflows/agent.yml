name: agent

on:
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
      - ".github/workflows/python-service.yml"
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
      - ".github/workflows/python-service.yml"

permissions:
  contents: read

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    uses: ./.github/workflows/python-service.yml
    permissions:
      contents: read
      packages: write
    with:
      context: agent
      image_name: kubesentinel-agent
      gitops_app: agent
    secrets:
      GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
