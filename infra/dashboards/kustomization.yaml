# Each JSON file becomes a ConfigMap labelled grafana_dashboard=1, which the Grafana
# sidecar picks up and provisions automatically. Applied by `make stack`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: dashboard-service-health
    files:
      - service-health.json
  - name: dashboard-cluster-health
    files:
      - cluster-health.json
  - name: dashboard-incidents
    files:
      - incidents.json
