[project]
name = "orders-api"
version = "0.1.0"
description = "Demo orders service that KubeSentinel observes and that chaos scenarios break on purpose"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.151.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.ruff]
# Resolve first-party imports relative to this file, so ruff behaves the same
# from the repo root (pre-commit) and from this directory (CI).
src = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
